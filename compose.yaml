services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: "${USER_NAME:-appuser}"
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        UV_VERSION: "${UV_VERSION:-0.11.28}"
        TORCH_VERSION: "${TORCH_VERSION:-2.8.0}"
        TORCH_BACKEND: "${TORCH_BACKEND:-cu128}"
    working_dir: /workspace/thesis-metadrive
    stdin_open: true
    tty: true
    ulimits:
      memlock: -1
      stack: 67108864
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      USER_NAME: "${USER_NAME:-appuser}"
      USER: "${USER_NAME:-appuser}"
      LOGNAME: "${USER_NAME:-appuser}"
      HOME: "${CONTAINER_HOME_DIR:-/workspace/.container-home}"
      UV_PROJECT_ENVIRONMENT: /opt/venv
      OUTPUTS_ROOT: "${OUTPUTS_ROOT:-/workspace/outputs}"
      DATA_ROOT: "${DATA_ROOT:-/workspace/data}"
      SCENARIONET_DATA_ROOT: "${SCENARIONET_DATA_ROOT:-/workspace/data/scenarionet}"
      METADRIVE_DATA_ROOT: "${METADRIVE_DATA_ROOT:-/workspace/data/metadrive}"
      WANDB_MODE: "${WANDB_MODE:-offline}"
      HYDRA_FULL_ERROR: "${HYDRA_FULL_ERROR:-1}"
      SCENARIONET_PIPELINE_CONFIG: "${SCENARIONET_PIPELINE_CONFIG:-/workspace/thesis-metadrive/conf/scenarios/pipeline_v1.yaml}"
      SCENARIONET_PG_COUNT: "${SCENARIONET_PG_COUNT:-}"
      SCENARIONET_PG_SEED_START: "${SCENARIONET_PG_SEED_START:-}"
      SCENARIONET_SPLIT_SEED: "${SCENARIONET_SPLIT_SEED:-}"
      SCENARIONET_AUTO_SPLIT: "${SCENARIONET_AUTO_SPLIT:-}"
      SCENARIONET_WAYMO_TRAIN_TARGET: "${SCENARIONET_WAYMO_TRAIN_TARGET:-}"
      SCENARIONET_WAYMO_VALIDATION_TARGET: "${SCENARIONET_WAYMO_VALIDATION_TARGET:-}"
      SCENARIONET_WAYMO_TEST_TARGET: "${SCENARIONET_WAYMO_TEST_TARGET:-}"
      SCENARIONET_PG_TRAIN_TARGET: "${SCENARIONET_PG_TRAIN_TARGET:-}"
      SCENARIONET_PG_VALIDATION_TARGET: "${SCENARIONET_PG_VALIDATION_TARGET:-}"
      SCENARIONET_PG_TEST_TARGET: "${SCENARIONET_PG_TEST_TARGET:-}"
      SCENARIONET_RUN_SIMULATION_CHECK: "${SCENARIONET_RUN_SIMULATION_CHECK:-}"
      SCENARIONET_CHECK_WORKERS: "${SCENARIONET_CHECK_WORKERS:-}"
    volumes:
      - .:/workspace/thesis-metadrive
      - ${HOST_OUTPUTS_DIR:-./outputs}:${CONTAINER_OUTPUTS_DIR:-/workspace/outputs}
      - ${HOST_DATA_DIR:-./data}:${CONTAINER_DATA_DIR:-/workspace/data}
      - ${HOST_CONTAINER_HOME_DIR:-./.container-home}:${CONTAINER_HOME_DIR:-/workspace/.container-home}
