# Internal thesis implementation kept as the temporary legacy baseline while
# fork-backed SB3 paths are consolidated.
name: ppo
share_encoder: true
verbose: 0
n_steps: 2048
batch_size: 64
n_epochs: 10
learning_rate: 3e-4
gamma: 0.99
gae_lambda: 0.95
learning_potential_gamma: 0.99
learning_potential_gae_lambda: 0.9
log_std_init: 0.0
optimizer_eps: 1e-5
ent_coef: 0.0
vf_coef: 0.5
clip_range: 0.2
clip_range_vf: null
target_kl: null
normalize_advantage: true
max_grad_norm: 0.5
monitor_ema_alpha: 0.1
