# Fork-backed SB3 baseline path. Keep thesis-specific network hooks in
# `thesis_rl.sb3_extensions`.
name: ppo_sb3
policy: MlpPolicy
verbose: 0
n_steps: 96
batch_size: 63
n_epochs: 10
learning_rate: 3e-4
# ADR-075: undiscounted. Exponential discounting erodes the rulebook's
# geometric priority weights at different rates, so at 0.99 a collision more
# than 15.7 s away costs less than one non-relaxable violation now -- inside a
# 20 s episode. Episodes terminate at the logged horizon, so the return is
# finite and the task is proper. One gamma for every arm: differing discounts
# would make results non-attributable to the preference structure under test.
# Declared fallback if the value-based arms fail to stabilize: 0.999 for ALL
# arms together, never per-arm, with the O3 degradation reported.
gamma: 1.0
gae_lambda: 0.95
# Must equal `gamma`: Ng et al.'s policy-invariance theorem for
# potential-based shaping holds only when the shaping discount is the MDP's.
learning_potential_gamma: 1.0
learning_potential_gae_lambda: 0.9
ent_coef: 0.0
vf_coef: 0.5
clip_range: 0.2
clip_range_vf: null
target_kl: null
normalize_advantage: true
max_grad_norm: 0.5
use_sde: false
sde_sample_freq: -1
monitor_ema_alpha: 0.1
policy_kwargs:
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
  share_features_extractor: true
  ortho_init: false
transition_replay:
  enabled: false
