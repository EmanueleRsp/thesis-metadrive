# Fork-backed SB3 baseline path. Keep thesis-specific network hooks in
# `thesis_rl.sb3_extensions`.
name: ppo_sb3
policy: MlpPolicy
verbose: 0
n_steps: 96
batch_size: 63
n_epochs: 10
learning_rate: 3e-4
gamma: 0.99
gae_lambda: 0.95
learning_potential_gamma: 0.99
learning_potential_gae_lambda: 0.9
ent_coef: 0.0
vf_coef: 0.5
clip_range: 0.2
clip_range_vf: null
target_kl: null
normalize_advantage: true
max_grad_norm: 0.5
use_sde: false
sde_sample_freq: -1
monitor_ema_alpha: 0.1
policy_kwargs:
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
  share_features_extractor: true
  ortho_init: false
transition_replay:
  enabled: false
