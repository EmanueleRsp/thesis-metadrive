# Internal thesis implementation kept as the temporary legacy baseline while
# fork-backed SB3 paths are consolidated.
name: sac
share_encoder: false
verbose: 0
learning_starts: 20000
batch_size: 128
buffer_size: 300000
train_freq: 1
# "auto" maps to the number of transitions collected in the last rollout,
# which is the closest legacy alias to SB3's gradient_steps=-1.
gradient_steps: auto
learning_rate: 3e-4
# ADR-075: undiscounted. Exponential discounting erodes the rulebook's
# geometric priority weights at different rates, so at 0.99 a collision more
# than 15.7 s away costs less than one non-relaxable violation now -- inside a
# 20 s episode. Episodes terminate at the logged horizon, so the return is
# finite and the task is proper. One gamma for every arm: differing discounts
# would make results non-attributable to the preference structure under test.
# Declared fallback if the value-based arms fail to stabilize: 0.999 for ALL
# arms together, never per-arm, with the O3 degradation reported.
gamma: 1.0
tau: 0.005
target_update_interval: 1
ent_coef: auto
target_entropy: auto
log_std_init: -3.0
log_std_bounds: [-20, 2]
offpolicy_debug:
  enabled: false
  log_path: ${paths.logs_dir}/offpolicy_debug_sac.jsonl
  log_interval_steps: 20000
  log_interval_update_calls: 250
  near_zero_eps: 0.05
monitor_ema_alpha: 0.1
