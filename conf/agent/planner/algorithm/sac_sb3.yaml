# Fork-backed SB3 baseline path. Keep thesis-specific network and future custom
# replay-buffer hooks in `thesis_rl.sb3_extensions`.
name: sac_sb3
policy: MlpPolicy
verbose: 0
learning_starts: 100
# ADR-078: 512 x 0.5 replaces RL-BASELINES v1's 256 x 1.0. The learner sees the
# same number of replay samples per collected transition (256 * 20 = 512 * 10
# with 20 workers) in half the optimizer steps, which is where the measured
# 179 ms/step learner cost lived (A/B screening, 2026-09-06). Run profiles
# override `batch_size`; keep them consistent with this value.
batch_size: 512
buffer_size: 300000
train_freq: 1
# `auto` resolves to `train_freq * n_envs * update_to_data_ratio` gradient steps
# per update call (ADR-078); 1.0 is the RL-BASELINES v1 resolution `n_envs`.
gradient_steps: auto
update_to_data_ratio: 0.5
# ADR-078: the post-update TD-residual learning potential is diagnostic-only
# under ACL v2.0 REQ-013 and costs one extra replay batch plus four network
# forward passes per update call. Off until a run needs the channel.
update_learning_potential_diagnostic: false
learning_rate: 3e-4
# ADR-079, amending ADR-075. Discounting does erode the geometric priority
# weights, but the binding comparison is one level apart -- L1 against L2
# ("violate the interaction-risk rule now, or collide in Delta steps?"), and
# identically L2 against L3 -- not the two-level one ADR-075 tabulated, so its
# break-even figures are 2x too generous. Dominance survives while
# `Delta < ln(a) / -ln(gamma)`. At `a = 2.5` (ADR-079) and the measured 199-step
# horizon (RULEBOOK-V5.1 §4.6: p5/p50/p95 = 197/199/200) that requires
# `gamma > 0.99541`; 0.996 gives 229 steps, a 15 % margin over the whole
# episode, and 457 steps for the two-level comparison.
#
# `gamma = 1` was not merely the conservative choice. Roughly two thirds of
# episodes end in a bootstrapped truncation at the horizon rather than a true
# terminal, and on those the backup `Q <- r + Q(s')` admits `V + c` for any
# constant `c`; only the terminating minority pins `c`, so approximation bias
# walks it -- the mechanism behind the observed critic-loss growth. What reaches
# `t = 0` is damped by `gamma^199`: 0.45 at 0.996, against 0.82 at ADR-075's
# declared 0.999 fallback, which restores the contraction on paper and damps
# almost nothing inside an episode.
#
# One gamma for every arm: differing discounts would make results
# non-attributable to the preference structure under test.
gamma: 0.996
tau: 0.005
ent_coef: auto
target_update_interval: 1
target_entropy: auto
action_noise_type: none
action_noise_sigma: 0.1
action_noise_mean: 0.0
use_sde: false
sde_sample_freq: -1
use_sde_at_warmup: false
monitor_ema_alpha: 0.1
policy_kwargs:
  net_arch: [256, 256]
  share_features_extractor: false
transition_replay:
  enabled: true
  n_steps: 3
  prioritized: true
  optimize_memory_usage: false
  store_reward_vector: false
  persistence:
    enabled: ${run_profile.replay_persistence}
    trigger: final_or_manual
    periodic_frequency_steps: null
    keep_last: 1
  per:
    alpha: 0.6
    beta_initial: 0.4
    beta_final: 1.0
    beta_anneal_steps: ${experiment.total_timesteps}
    epsilon: 1.0e-6
    priority_aggregation: mean_abs_twin_td
    new_transition_priority: current_max
    duplicate_update_reduction: max
    sampling: proportional_stratified
    tree_dtype: float64
