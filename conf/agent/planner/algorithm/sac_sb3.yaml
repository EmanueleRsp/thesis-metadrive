# Fork-backed SB3 baseline path. Keep thesis-specific network and future custom
# replay-buffer hooks in `thesis_rl.sb3_extensions`.
name: sac_sb3
policy: MlpPolicy
verbose: 0
learning_starts: 100
batch_size: 256
buffer_size: 1000000
train_freq: 1
gradient_steps: auto
learning_rate: 3e-4
gamma: 0.99
tau: 0.005
ent_coef: auto
target_update_interval: 1
target_entropy: auto
action_noise_type: none
action_noise_sigma: 0.1
action_noise_mean: 0.0
use_sde: false
sde_sample_freq: -1
use_sde_at_warmup: false
monitor_ema_alpha: 0.1
policy_kwargs:
  net_arch: [256, 256]
