# Fork-backed SB3 baseline path. Keep thesis-specific network and future custom
# replay-buffer hooks in `thesis_rl.sb3_extensions`.
name: td3_sb3
policy: MlpPolicy
verbose: 0
learning_starts: 10000
batch_size: 256
buffer_size: 300000
train_freq: 1
gradient_steps: auto
# ADR-078: diagnostic-only post-update learning potential (ACL v2.0 REQ-013),
# switched off for throughput. TD3 batch size and gradient steps are unchanged.
update_learning_potential_diagnostic: false
learning_rate: 3e-4
# ADR-075: undiscounted. Exponential discounting erodes the rulebook's
# geometric priority weights at different rates, so at 0.99 a collision more
# than 15.7 s away costs less than one non-relaxable violation now -- inside a
# 20 s episode. Episodes terminate at the logged horizon, so the return is
# finite and the task is proper. One gamma for every arm: differing discounts
# would make results non-attributable to the preference structure under test.
# Declared fallback if the value-based arms fail to stabilize: 0.999 for ALL
# arms together, never per-arm, with the O3 degradation reported.
gamma: 1.0
tau: 0.005
action_noise_type: normal
action_noise_sigma: 0.1
action_noise_mean: 0.0
monitor_ema_alpha: 0.1
# Diagnostic-only: AMP changes numerical execution and must remain false for
# every scientific profile.
diagnostic_mixed_precision: false
policy_kwargs:
  net_arch: [256, 256]
  share_features_extractor: false
transition_replay:
  enabled: true
  n_steps: 3
  prioritized: true
  optimize_memory_usage: false
  store_reward_vector: false
  persistence:
    enabled: ${run_profile.replay_persistence}
    trigger: final_or_manual
    periodic_frequency_steps: null
    keep_last: 1
  per:
    alpha: 0.6
    beta_initial: 0.4
    beta_final: 1.0
    beta_anneal_steps: ${experiment.total_timesteps}
    epsilon: 1.0e-6
    priority_aggregation: mean_abs_twin_td
    new_transition_priority: current_max
    duplicate_update_reduction: max
    sampling: proportional_stratified
    tree_dtype: float64
