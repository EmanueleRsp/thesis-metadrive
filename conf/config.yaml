name: PLN_${agent.planner.algorithm.name}_REW_${hydra:runtime.choices.reward}_CUR_${hydra:runtime.choices.curriculum}
# Base composition for all runs.
# Use a preset via `--config-name presets/...` to override groups in one shot,
# and optionally add CLI overrides (e.g. `run_profile=medium`).
defaults:
  - env: scenarionet        # Canonical final environment family.
  - obs: semantic_v3         # OBS-V1.3 perception-bounded observation (D=3009).
  - experiment: default
  - evaluation: scenarionet_panels
  - reward: scalar_reward   # Final Rulebook scalar reward.
  - video: default          # Video/replay pipeline settings in `conf/video/*`
  - run_profile: smoke      # Short integration profile by default.
  - gold_suite: default      # Reference-only Rulebook diagnostic controls.

  - agent/preprocessor: identity       # Observation preprocessor in `conf/agent/preprocessor/*`
  - agent/planner/encoder: lq_v3       # Planner feature encoder in `conf/agent/planner/encoder/*` (ENC-V1.3, pairs with obs=semantic_v3)
  - agent/planner/decoder: mlp_encoded # Planner head decoder profile in `conf/agent/planner/decoder/*`
  - agent/planner/algorithm: td3_sb3   # Primary final learner; make run requires an explicit choice.
  - agent/adapter: identity            # Action adapter in `conf/agent/adapter/*`

  - scalarization: default  # SCAL-V1.1 formula and immutable run parameters
  - curriculum: scenario_acl_scenarionet
  
  - override hydra/job_logging: disabled

  - _self_

seed: 42
device: auto
# C28. Device for the *asynchronous evaluator* subprocess. Null keeps `device`,
# which is the historical behaviour: the evaluator loads a second copy of the
# policy onto the training accelerator while the learner is mid-update, and that
# is what produced the observed out-of-memory. Set it to `cpu` to move the
# evaluator off the accelerator entirely, at the cost of a slower panel; the
# evaluator runs concurrently with training, so a slower panel is usually free.
eval_device: null

runtime:
  # Null preserves PyTorch's process-wide default. Positive values are an
  # explicit diagnostic cap for the learner/parent process only.
  parent_torch_num_threads: null

# Explicit authoritative Rulebook selector used by the final scalar pipeline.
#
# All three keys are declared rather than left to a reader's default. They were
# omitted before, and the two readers of this block disagreed about what an
# omission meant: `runtime/io/metadata.py` substituted the literal "v1" while
# `contracts/reward_semantics.py` substituted the version string, so one run's
# `run_metadata.yaml` and its own checkpoint sidecar recorded different families
# and neither recorded the family that actually ran (`open_items` C8).
#
# `version` names the *implementation family* of the Rulebook v2 machinery, not
# the specification version: `runtime/wiring/builders.py` accepts it inside a set
# alongside "v2" and "v4.6" and routes every member to the same v2 adapter. The
# specification actually in force is `specification_id`. Renaming the family
# string is deliberately out of scope here because it is also stamped into cached
# rulebook-catalog provenance, where a change invalidates the cache.
rulebook:
  implementation_family: v2
  specification_id: RULEBOOK-V5.1
  version: 4.7-final-implementation-complete

logging:
  # Global minimum level for thesis_rl loggers (DEBUG | INFO | WARNING | ERROR | CRITICAL)
  level: INFO
  # Console stream handler level for run loggers.
  console_level: WARNING
  # File handler default level for run loggers.
  file_level: INFO

scenario_splits:
  # MetaDrive treats reset(seed=...) as a scenario index.
  # Keep scenario pools disjoint across train/validation/test:
  # train starts at env.config.start_seed,
  # validation at env.config.start_seed + validation_offset,
  # final test at env.config.start_seed + test_offset.
  # `stride` should be larger than any per-stage scenario window.
  stride: 1000000
  validation_offset: 1000000
  test_offset: 2000000

analysis:
  include_in_comparison: true  # Set false for debug/tuning runs excluded from multi-run comparisons.
  experiment_group: EXP_${experiment.name}_RP_${run_profile.name}_CUR_${curriculum.name}_REW_${reward.name}

# Output layout for a single run.
paths:
  user_name: ${oc.env:USER_NAME,appuser}
  outputs_root: ${oc.env:OUTPUTS_ROOT,/workspace/outputs}
  data_root: ${oc.env:DATA_ROOT,/workspace/data}
  scenarionet_data_root: ${oc.env:SCENARIONET_DATA_ROOT,${paths.data_root}/scenarionet}
  metadrive_data_root: ${oc.env:METADRIVE_DATA_ROOT,${paths.data_root}/metadrive}
  analysis_root: ${paths.outputs_root}/analysis
  run_dir: ${paths.outputs_root}/${analysis.experiment_group}/${agent.planner.algorithm.name}/seed_${seed}/${now:%Y%m%d_%H%M%S}
  logs_dir: ${paths.run_dir}/logs
  checkpoints_dir: ${paths.run_dir}/checkpoints
  videos_dir: ${paths.run_dir}/videos
  csv_dir: ${paths.run_dir}/csv
  artifacts_dir: ${paths.run_dir}/artifacts

checkpoint_path: ${paths.checkpoints_dir}/final.zip  # Canonical final checkpoint path.

checkpoint:
  save_latest_each_chunk: true                       # Update `checkpoints/latest.zip` at each training chunk.
  save_final: true                                   # Write `checkpoints/final.zip` at end of training.
  save_best_lexicographic: true                      # Save best by global safety/task lexicographic key.
  save_best_lexicographic_rulebook: true             # Save best by strict per-rule margin comparison.
  save_best_thresholded_lexicographic_rulebook: true # Save best by thresholded per-rule comparison.
  save_periodic: true                                # Save periodic snapshots every N global steps.
  periodic_interval_steps: 250000                    # Global-step interval for periodic snapshots.
  keep_last_periodic: 4                              # Retain only latest N periodic checkpoints.
  save_rng_state: true                               # Persist RNG state for reproducible resume.
  resume:
    enabled: false                                    # Enable resume from an existing run directory.
    run_dir: null                                     # Null => resume in current `paths.run_dir`.
    checkpoint_name: latest                           # latest | final | <checkpoint stem under checkpoints/>
    restore_rng_state: true                           # Restore python/numpy/torch RNG state if available.

# Hydra runtime outputs.
hydra:
  run:
    dir: ${paths.run_dir}
  output_subdir: hydra
