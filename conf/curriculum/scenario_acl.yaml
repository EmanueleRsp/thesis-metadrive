name: scenario_acl
enabled: true
kind: scenario_acl
scenario_acl:
  mode: mab_generate_only

  buffer_capacity: 1000
  warmup_buffer_size: 100

  exploit_probability: 0.8
  generate_probability: 0.2

  use_mab: true
  use_scenario_buffer: true
  use_replay: false
  use_mutation: false
  use_staleness: true
  use_rule_criticality: true

  mutation_per_exploit: 2
  recent_window_size: 100

  mab:
    num_arms: 7
    eta: 0.2
    alpha: 0.005
    initial_weight: 1.0
    use_target_mab: true
    target_sync_interval: 5
    weight_clip_min: -5.0
    weight_clip_max: 5.0
    feedback: rank_normalized_usefulness

  replay_sampling:
    omega: 0.7
    beta: 1.0
    staleness_offset: 1
    rank_one_is_best: true

  mutation:
    buffer_min_size_for_mutation: 100
    max_children_per_parent: 5
    max_mutation_attempts: 5
    mutation_probs:
      temporal_shift_vehicle: 0.40
      longitudinal_shift_vehicle: 0.20
      remove_actor: 0.15
      shift_static_object: 0.15
      clone_static_object: 0.10
    min_time_shift: -10
    max_time_shift: 10
    min_long_shift: -3.0
    max_long_shift: 3.0
    min_dist_from_ego: 10.0
    min_dist_between_objects: 3.0
    max_lane_distance: 4.0
    valid_check: true
    min_initial_collision_margin: 0.3
    max_speed: 45.0
    max_acc: 12.0
    max_heading_jump: 1.05
    min_sdc_valid_steps: 50
    smoke_test_steps: 20
    reactive_traffic: true

  validation:
    valid_check: true
    min_collision_margin: 0.3
    max_lane_dist: 4.0
    dt: 0.1
    max_speed: 45.0
    max_acc: 12.0
    max_heading_jump: 1.05
    min_sdc_valid_steps: 50
    smoke_test_steps: 20

  scenario_env:
    horizon: 1000
    truncate_as_terminate: false
    out_of_route_done: false
    out_of_road_done: false
    on_continuous_line_done: false
    on_broken_line_done: false
    crash_vehicle_done: true
    crash_object_done: true
    crash_human_done: true
    reactive_traffic: true
    agent_policy: EnvInputPolicy
    log_level: 50
