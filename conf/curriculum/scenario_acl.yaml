name: scenario_acl
enabled: true
kind: scenario_acl
scenario_acl:
  buffer_capacity: 1000
  warmup_buffer_size: 100

  generate_probability: 0.40
  exploit_probability: 0.60

  use_mab: true
  use_scenario_buffer: true
  use_replay: true
  use_staleness: true
  recent_window_size: 100

  mab:
    num_arms: 6
    eta: 0.20
    update_method: ema
    alpha: 0.10
    initial_score: 0.50
    temperature: 0.50
    use_importance_correction: false
    use_target_mab: false
    target_sync_interval: 1
    feedback: rank_normalized_learning_potential

  replay_sampling:
    omega: 0.7
    beta: 1.0
    staleness_offset: 1

  scenario_env:
    horizon: 1000
    truncate_as_terminate: false
    out_of_route_done: false
    out_of_road_done: false
    on_continuous_line_done: false
    on_broken_line_done: false
    crash_vehicle_done: true
    crash_object_done: true
    crash_human_done: true
    reactive_traffic: true
    agent_policy: EnvInputPolicy
    log_level: 50
