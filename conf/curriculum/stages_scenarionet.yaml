name: stages_scenarionet
enabled: true
kind: staged

# ScenarioNet staged curriculum. Each stage selects one realized semantic arm
# through the provider; source balance is inherited from env/scenarionet.yaml
# except for A0 and A4, whose source availability is one-sided in the frozen
# catalog: A0 is PG-only and A4 is Waymo-only because PG has no VRUs.
staged:
  mode: auto
  fixed_stage: A0_simple_low_traffic
  stages:
    - name: A0_simple_low_traffic
      env:
        provider:
          arm: A0_simple_low_traffic
          source_probability:
            waymo: 0.0
            pg: 1.0
      eval_env: {}
    - name: A1_traffic
      env:
        provider:
          arm: A1_traffic
      eval_env: {}
    - name: A2_junction
      env:
        provider:
          arm: A2_junction
      eval_env: {}
    - name: A3_complex_junction
      env:
        provider:
          arm: A3_complex_junction
      eval_env: {}
    - name: A4_vru
      env:
        provider:
          arm: A4_vru
          source_probability:
            waymo: 1.0
            pg: 0.0
      eval_env: {}
    - name: A5_critical_mixed
      env:
        provider:
          arm: A5_critical_mixed
      eval_env: {}
  promotion:
    consecutive_evals: 2
    warmup_evals: 1
    default_min_stage_steps: 25000
    gates:
      safety:
        collision_rate_max: 0.05
        top_rule_violation_rate_max: 0.02
        out_of_road_rate_max: 0.10
      task:
        success_rate_min: 0.60
        route_completion_min: 0.85
      stability:
        success_rate_std_max: 0.20
        collision_rate_std_max: 0.08
