name: scenarionet
env_id: ThesisScenarioEnv

split: train
# Normal runs need only this root. The factory derives the canonical catalog and
# matching runtime/<split> view; catalog_path is an override for diagnostics.
dataset_root: ${oc.env:SCENARIONET_DATA_ROOT,${oc.env:DATA_ROOT,/workspace/data}/scenarionet}
catalog_path: null
# Root seed for ScenarioNet provider sampling. Keep it tied to the run seed so
# MAB arm choices and catalog-record choices belong to one reproducible run.
global_seed: ${seed}

config:
  data_directory: null
  curriculum_level: 1
  horizon: null
  allowed_more_steps: null
  start_scenario_index: 0
  num_scenarios: -1
  worker_index: 0
  num_workers: 1
  sequential_seed: false
  agent_policy: env_input_policy
  discrete_action: false
  set_static: false
  no_map: false
  need_lane_localization: true
  cull_lanes_outside_map: true
  map_region_size: 1024
  no_traffic: false
  no_static_vehicles: false
  no_light: false
  reactive_traffic: true
  filter_overlapping_car: true
  skip_missing_light: true
  static_traffic_object: true
  store_data: false
  store_map: false
  physics_world_step_size: 0.02
  decision_repeat: 5
  crash_vehicle_done: true
  crash_object_done: true
  crash_human_done: true
  out_of_route_done: false
  relax_out_of_road_done: false
  truncate_as_terminate: false
  # Do not inherit ScenarioEnv's short-route success shortcut: routes below
  # 10 m are not meaningful RL episodes.
  success_route_completion_threshold: 0.95
  minimum_success_route_length_m: 10.0
  log_level: 50

episode_control:
  extra_steps_after_scenario: 50

provider:
  # Supported kinds: uniform, arm_uniform, fixed_sequence.
  kind: uniform
  strict: true
  allow_fallback: false
  # Optional semantic arm filter. Staged ScenarioNet curricula override this
  # with one of A0...A5; null keeps the global source-balanced provider.
  arm: null
  # Optional immutable UID manifest used by the dedicated golden-suite trace.
  scenario_uids_file: null
  repeat: false
  source_probability:
    waymo: 0.5
    pg: 0.5

vectorized:
  enabled: false
  num_envs: 1
  start_method: spawn

policy_mode:
  enabled: false
  agent_policy: env_input_policy
  action_check: true
  low: -1.0
  high: 1.0
