# @package _global_
# Legacy compatibility preset during SB3-fork migration.
# Prefer `presets/agent/sac_sb3` for new runs.
defaults:
  - /config
  - override /obs: semantic_state
  - override /agent/planner/encoder: none
  - override /agent/planner/decoder: sac_sb3
  - override /agent/planner/algorithm: sac
  - _self_
