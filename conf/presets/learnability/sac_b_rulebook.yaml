# @package _global_
# Learnability screening, arm B: the RULEBOOK-V5.1 six-level margin vector,
# scalarized by SCAL-V1.4, drives learning.
#
# The only difference from `sac_a_native.yaml` is `reward.behavior`. Everything
# else -- algorithm, encoder, decoder, observation, budget, environment, source
# mix, seeds, evaluation panels -- is held identical, which is what makes the
# A-B contrast attributable to the reward alone. `scalarization=default` is
# inherited from `/config` and is the authoritative SCAL-V1.4 block; the legacy
# `a`/`scales` keys in `conf/reward/rulebook_defaults.yaml` are not read on this
# path (`runtime/wiring/builders.py:373` consumes the top-level group).
defaults:
  - /config
  - override /run_profile: medium
  - override /reward: scalar_reward
  - override /curriculum: disabled
  - override /agent/planner/algorithm: sac_sb3
  - override /agent/planner/decoder: sac_sb3
  # ENC-V1.3, the production architecture (16 latents, depth 4). NOT `lq_v3_lite`,
  # which the repository itself labels `architecture_version: diagnostic-only` and
  # names `latent_query_v3_lite_diagnostic`: a screening that licenses a freeze must
  # not be able to fail for lack of encoder capacity, which would be indistinguishable
  # from the reward being unlearnable. Measured cost of the production encoder:
  # micro (4 latents, depth 1) ran at 7.71 fps and lite (8, 2) at 6.68 fps on the same
  # `medium` profile, so the simulator dominates and the full encoder costs roughly
  # 15 %, not a multiple.
  - override /agent/planner/encoder: lq_v3
  - _self_

# EVAL-PROTOCOL REQ-018: see the sibling arm.
analysis:
  experiment_group: SCREEN-LEARNABILITY-B-RULEBOOK-01

experiment:
  name: learnability-b-rulebook

env:
  vectorized:
    enabled: true
    num_envs: 20
