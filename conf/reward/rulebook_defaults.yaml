# Shared rulebook instrumentation/scalarization defaults.
# Concrete reward presets should inherit this file.

# Name of rulebook config in conf/rulebook/*.yaml
rulebook_config: selection

# Fail the run on unavailable inputs, rule errors, or any fallback path.
# Set false only when deliberately debugging runtime input availability.
rulebook_strict: true

# Hyperparameters for scalar rulebook aggregation
# (used when behavior=scalar_reward)
a: 2.01
c: 30.0
lambda_env: 0.0
lambda_rule: 1.0
scales:
  # Initial calibration values. Re-estimate from a representative v1 run
  # before comparing reward scales across experiments.
  collision_severity: 10000.0
  allowed_driving_area: 10.0
  lane_marking_compliance: 1.0
  local_route_progress: 1.0

# Debug/diagnostic controls
include_violation_vector: false
rule_margin_log_path: ${paths.logs_dir}/rule_margins.jsonl
attach_info: true

# Runtime info debug controls
runtime_info_debug_enabled: false
runtime_info_debug_path: ${paths.logs_dir}/runtime_info_debug.jsonl
