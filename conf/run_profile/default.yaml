# @package _global_
run_profile:
  name: default
  replay_persistence: true   # ADR-079 (supersedes ADR-017): periodic paired replay snapshot for crash-safe resume.

experiment:
  name: default
  total_timesteps: 600000
  log_interval: 200
  eval_interval: 25000
  eval_episodes: 50
  final_eval_episodes: 100

planner:
  td3:
    learning_starts: 10000
    batch_size: 512
  sac:
    learning_starts: 10000
    batch_size: 512

checkpoint:
  periodic_interval_steps: 250000
  keep_last_periodic: 4
