# @package _global_
run_profile:
  name: fast
  replay_persistence: true   # ADR-079 (supersedes ADR-017): periodic paired replay snapshot for crash-safe resume.

experiment:
  name: fast
  total_timesteps: 120000
  log_interval: 200
  eval_interval: 10000
  eval_episodes: 20
  final_eval_episodes: 40

planner:
  td3:
    learning_starts: 5000
    batch_size: 512
    buffer_size: 24000
  sac:
    learning_starts: 1000
    batch_size: 512
    buffer_size: 24000

checkpoint:
  periodic_interval_steps: 50000
  keep_last_periodic: 3
