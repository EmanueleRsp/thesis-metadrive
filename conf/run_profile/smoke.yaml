# @package _global_
run_profile:
  name: smoke

experiment:
  name: run
  total_timesteps: 2000
  log_interval: 100
  eval_interval: 1000
  eval_episodes: 2
  final_eval_episodes: 2

checkpoint:
  periodic_interval_steps: 10000
  keep_last_periodic: 1

# Smoke-specific learner warm-up/batch values. These override the selected
# algorithm backend through the runtime planner merge without changing thesis
# and long-run algorithm defaults.
planner:
  learning_starts: 100
  batch_size: 64
