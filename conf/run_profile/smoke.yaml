# @package _global_
run_profile:
  name: smoke
  replay_persistence: true

experiment:
  name: run
  total_timesteps: 2000
  log_interval: 200
  eval_interval: 1000
  eval_episodes: 2
  final_eval_episodes: 5

checkpoint:
  periodic_interval_steps: 10000
  keep_last_periodic: 1

# Smoke-specific learner warm-up/batch values. These override the selected
# algorithm backend through the runtime planner merge without changing thesis
# and long-run algorithm defaults.
planner:
  td3:
    learning_starts: 100
    batch_size: 64
  sac:
    learning_starts: 100
    batch_size: 64
  ppo:
    n_steps: 16
    batch_size: 8

reward:
  rule_margin_log_path: ${paths.logs_dir}/rule_margins.jsonl

video:
  save_trajectory_log: true
