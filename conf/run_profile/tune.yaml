# @package _global_
run_profile:
  name: tune
  replay_persistence: false

experiment:
  name: tune
  total_timesteps: 500000
  log_interval: 1000
  eval_interval: 25000
  eval_episodes: 20
  final_eval_episodes: 50

planner:
  td3:
    learning_starts: 10000
    batch_size: 256
  sac:
    learning_starts: 5000
    batch_size: 256

checkpoint:
  periodic_interval_steps: 125000
  keep_last_periodic: 4
