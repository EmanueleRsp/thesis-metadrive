# @package _global_
run_profile:
  name: tune
  replay_persistence: true   # ADR-079 (supersedes ADR-017): periodic paired replay snapshot for crash-safe resume.

experiment:
  name: tune
  total_timesteps: 500000
  log_interval: 200
  eval_interval: 50000
  eval_episodes: 20
  final_eval_episodes: 50

planner:
  td3:
    learning_starts: 10000
    batch_size: 512
  sac:
    learning_starts: 5000
    batch_size: 512

checkpoint:
  periodic_interval_steps: 125000
  keep_last_periodic: 4
