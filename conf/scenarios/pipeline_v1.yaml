pipeline_version: scenarionet_pipeline_v2

# Scientific/data policy defaults. Host paths and credentials stay in .env.
waymo:
  auto_expand: true
  batch_shards: 128
  max_new_shards: 1000
  workers: 32
  keep_raw_batches: false
  required_arms:
    # A4_vru is structurally Waymo-only. This is an acquisition feasibility
    # lower bound, not a post-selection balancing rule.
    A4_vru: 584

pg:
  count_per_profile: 350
  seed_start: 920000
  workers: 32
  max_composition_replenishment_blocks: 50
  replenishment_candidate_budget: 1750

# The final ScenarioNet splits are Rulebook v2 pools: static Rulebook
# eligibility is evaluated before split assignment and recorded separately.
rulebook_v2:
  enabled: true
  workers: 32

split:
  seed: 0
  auto: true
  selection: balanced_arm_source
  allowed_signal_reliabilities:
    waymo: [complete, not_applicable]
    pg: [complete, not_applicable]
  targets:
    waymo:
      train: 1000
      validation: 250
      test: 500
    pg:
      train: 1000
      validation: 250
      test: 500

checks:
  simulation: true
  workers: 32
