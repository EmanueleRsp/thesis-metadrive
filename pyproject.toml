[project]
name = "thesis-rl"
version = "0.1.0"
description = "Modular MetaDrive RL codebase for thesis experiments"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "metadrive-simulator",
  "scenarionet",
  "gymnasium",
  "stable-baselines3",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.24,<2",
  "pandas>=2,<3",
  "pyarrow>=14",
  "pyyaml>=6",
  "setuptools<81",
  "tensorboard",
  "rich",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff",
  "mypy",
]

[tool.uv]
package = true
exclude-dependencies = ["torch"]

[tool.uv.sources]
metadrive-simulator = { path = "third_party/metadrive", editable = true }
stable-baselines3 = { path = "third_party/stable-baselines3", editable = true }
scenarionet = { path = "third_party/scenarionet", editable = true }

[tool.uv.extra-build-dependencies]
pandas = ["setuptools<81"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".container-home",
  "data",
  "outputs",
  "third_party",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires the simulator and bundled or generated scenario data",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
